<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Add a piece · Hi.Inya admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="wordmark">HI.INYA</a>
    <p class="eyebrow admin-tag">Admin</p>
  </header>

  <main class="wrap admin">
    <section class="admin-intro">
      <h1>Add a piece</h1>
      <p>Fill this in and click <strong>Publish</strong>. It shows up on the site in about a minute.</p>
    </section>

    <div id="done" class="done" hidden role="status">
      <p class="eyebrow">Published</p>
      <h2 id="done-title"></h2>
      <p>It'll be live in about a minute. <a id="done-link" href="#" target="_blank" rel="noopener">View it on the site</a></p>
      <button type="button" id="add-another" class="book">Add another piece</button>
    </div>

    <div id="editor" class="admin-grid">
      <form id="piece-form" class="admin-form" novalidate>
        <label>Photos <span class="opt">the first one is the cover</span>
          <input name="photos" type="file" accept="image/*" multiple />
        </label>
        <div id="thumbs" class="thumbs"></div>

        <label>Name
          <input name="name" required placeholder="Leona Dress" />
        </label>
        <div class="row">
          <label>Category
            <select name="category">
              <option value="dress">Dress</option>
              <option value="top">Top</option>
            </select>
          </label>
          <label>Brand
            <input name="brand" placeholder="Love Bonito" />
          </label>
        </div>
        <label>Size
          <input name="size" placeholder="S / EU 36 / UK 8 / US 4" />
        </label>
        <div class="row">
          <label>2-day price
            <input name="price2" inputmode="numeric" placeholder="500" />
          </label>
          <label>3-day price
            <input name="price3" inputmode="numeric" placeholder="550" />
          </label>
        </div>

        <details class="more">
          <summary>More options</summary>
          <label>Short name <span class="opt">shorter name for the collection card</span>
            <input name="shortName" />
          </label>
          <label>Link id <span class="opt">the end of the piece's web address</span>
            <input name="id" pattern="[a-z0-9-]+" />
          </label>
          <label>Booked dates <span class="opt">one per line: 2026-12-05 or 2026-12-05 to 2026-12-07</span>
            <textarea name="booked" rows="2"></textarea>
          </label>
          <label>Laundering dates <span class="opt">same format</span>
            <textarea name="laundering" rows="2"></textarea>
          </label>
        </details>

        <p id="form-error" class="form-error" role="alert"></p>
        <div class="publish-row">
          <button type="submit" id="publish" class="book">Publish</button>
          <span id="progress" class="progress" aria-live="polite"></span>
        </div>
      </form>

      <aside class="admin-side">
        <p class="eyebrow">How it'll look</p>
        <div id="preview" class="preview"></div>
      </aside>
    </div>

    <section class="existing">
      <p class="eyebrow">On the site</p>
      <ul id="existing" class="existing-list"></ul>
    </section>
  </main>

  <script src="products.js"></script>
  <script src="admin.js"></script>
</body>
</html>
